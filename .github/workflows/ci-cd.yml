name: TaskFlow CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-build-test:
    name: CI - Build and smoke test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          test -f src/Index.html
          test -f src/style.css
          test -f src/script.js
          test -f Dockerfile

      - name: Build Docker image
        run: docker build -t taskflow-uts:${{ github.sha }} .

      - name: Run container for smoke test
        run: |
          docker run -d --name taskflow-ci-test -p 8080:80 taskflow-uts:${{ github.sha }}
          for attempt in $(seq 1 15); do
            if curl --fail http://localhost:8080/; then
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:8080/ | grep -qi "TaskFlow"
          curl --fail http://localhost:8080/style.css > /dev/null
          curl --fail http://localhost:8080/script.js > /dev/null

      - name: Show container status
        if: always()
        run: |
          docker ps -a
          docker logs taskflow-ci-test || true
          docker rm -f taskflow-ci-test || true

  cd-local:
    name: CD - Deploy to local Docker host
    needs: ci-build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker Engine
        shell: powershell
        run: docker version

      - name: Build latest image on local machine
        shell: powershell
        run: docker build -t taskflow-uts:latest .

      - name: Replace running local container
        shell: powershell
        run: |
          docker rm -f taskflow-web 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          docker run -d --name taskflow-web --restart unless-stopped -p 8080:80 taskflow-uts:latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify local deployment
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "TaskFlow local deployment failed." }
          if ($response.Content -notmatch "TaskFlow") { throw "TaskFlow page content was not found." }
          docker ps --filter "name=taskflow-web"
