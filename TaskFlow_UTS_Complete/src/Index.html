<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - CI/CD Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .badge { display: inline-block; background: #28a745; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        h1 { font-size: 24px; margin-bottom: 8px; color: #111; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        button.btn-add { background: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.btn-add:hover { background: #0056b3; }
        ul { list-style: none; }
        li { background: #f8f9fa; border: 1px solid #e9ecef; padding: 10px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-del:hover { background: #bd2130; }
        footer { margin-top: 25px; text-align: center; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="card">
    <span class="badge">🚀 Deployed via Docker & CI/CD</span>
    <h1>Aplikasi Manajemen Tugas</h1>
    <p class="subtitle">Studi Kasus Deployment Container & Otomatisasi Pipeline</p>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Masukkan tugas baru...">
        <button class="btn-add" onclick="addTask()">Tambah</button>
    </div>

    <ul id="taskList">
        <li>
            <span>Demo: Pengujian Container Docker/Podman</span>
            <button class="btn-del" onclick="removeTask(this)">Hapus</button>
        </li>
        <li>
            <span>Demo: Pengujian Pipeline CI/CD GitHub Actions</span>
            <button class="btn-del" onclick="removeTask(this)">Hapus</button>
        </li>
    </ul>

    <footer>
        <p>Kelompok Studi Kasus Deployment &copy; 2026</p>
    </footer>
</div>

<script>
    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if (text === '') return;

        const ul = document.getElementById('taskList');
        const li = document.createElement('li');
        li.innerHTML = `<span>${text}</span> <button class="btn-del" onclick="removeTask(this)">Hapus</button>`;
        ul.appendChild(li);

        input.value = '';
    }

    function removeTask(btn) {
        btn.parentElement.remove();
    }
</script>

</body>
</html>
